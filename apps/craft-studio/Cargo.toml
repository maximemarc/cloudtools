[package]
name = "craft-studio"
description = "Every Craft app in one window"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "craft-studio"
path = "src/main.rs"

[features]
default = ["artcraft", "photocraft", "lightcraft", "filmcraft", "pdfcraft", "vectorcraft", "effectcraft", "wordcraft", "designcraft", "gridcraft", "cadcraft", "deckcraft", "soundcraft"]
artcraft = ["dep:studio-artcraft"]
photocraft = ["dep:studio-photocraft"]
lightcraft = ["dep:studio-lightcraft"]
filmcraft = ["dep:studio-filmcraft"]
pdfcraft = ["dep:studio-pdfcraft"]
vectorcraft = ["dep:studio-vectorcraft"]
effectcraft = ["dep:studio-effectcraft"]
wordcraft = ["dep:studio-wordcraft"]
designcraft = ["dep:studio-designcraft"]
gridcraft = ["dep:studio-gridcraft"]
cadcraft = ["dep:studio-cadcraft"]
deckcraft = ["dep:studio-deckcraft"]
soundcraft = ["dep:studio-soundcraft"]

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence", "links"] }
egui = "0.36"
env_logger = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
log = "0.4"
studio-core = { path = "../../crates/studio-core" }
studio-artcraft = { path = "../../crates/modules/artcraft", optional = true }
studio-photocraft = { path = "../../crates/modules/photocraft", optional = true }
studio-lightcraft = { path = "../../crates/modules/lightcraft", optional = true }
studio-filmcraft = { path = "../../crates/modules/filmcraft", optional = true }
studio-pdfcraft = { path = "../../crates/modules/pdfcraft", optional = true }
studio-vectorcraft = { path = "../../crates/modules/vectorcraft", optional = true }
studio-effectcraft = { path = "../../crates/modules/effectcraft", optional = true }
studio-wordcraft = { path = "../../crates/modules/wordcraft", optional = true }
studio-designcraft = { path = "../../crates/modules/designcraft", optional = true }
studio-gridcraft = { path = "../../crates/modules/gridcraft", optional = true }
studio-cadcraft = { path = "../../crates/modules/cadcraft", optional = true }
studio-deckcraft = { path = "../../crates/modules/deckcraft", optional = true }
studio-soundcraft = { path = "../../crates/modules/soundcraft", optional = true }

# `cargo deb --no-build` in packaging/package.sh, which writes target/release/package first.
[package.metadata.deb]
name = "craft-studio"
maintainer = "maximemarc <maximemarc@users.noreply.github.com>"
copyright = "the cloudtools contributors and the Craft app authors (github.com/storytold)"
extended-description = """\
Every Craft app in one window: ArtCraft, PhotoCraft, LightCraft, FilmCraft, EffectCraft, \
VectorCraft, DesignCraft, PdfCraft, WordCraft, GridCraft, DeckCraft, CADCraft and SoundCraft."""
section = "graphics"
priority = "optional"
depends = "$auto"
# wgpu and winit load these at run time (Vulkan, or GL through EGL; keyboard layouts on X11).
recommends = "libvulkan1, mesa-vulkan-drivers, libegl1, libxkbcommon-x11-0"
assets = [
    ["target/release/craft-studio", "usr/bin/", "755"],
    ["packaging/linux/craft-studio.desktop", "usr/share/applications/", "644"],
    ["target/release/package/icons/craft-studio-16.png", "usr/share/icons/hicolor/16x16/apps/craft-studio.png", "644"],
    ["target/release/package/icons/craft-studio-32.png", "usr/share/icons/hicolor/32x32/apps/craft-studio.png", "644"],
    ["target/release/package/icons/craft-studio-48.png", "usr/share/icons/hicolor/48x48/apps/craft-studio.png", "644"],
    ["target/release/package/icons/craft-studio-64.png", "usr/share/icons/hicolor/64x64/apps/craft-studio.png", "644"],
    ["target/release/package/icons/craft-studio-128.png", "usr/share/icons/hicolor/128x128/apps/craft-studio.png", "644"],
    ["target/release/package/icons/craft-studio-256.png", "usr/share/icons/hicolor/256x256/apps/craft-studio.png", "644"],
    ["target/release/package/icons/craft-studio-512.png", "usr/share/icons/hicolor/512x512/apps/craft-studio.png", "644"],
    ["target/release/package/licenses/THIRD-PARTY-LICENSES.txt", "usr/share/doc/craft-studio/", "644"],
]
