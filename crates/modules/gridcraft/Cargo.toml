# Generated by scripts/gen-module-manifests.py from upstream/gridcraft/apps/gridcraft/Cargo.toml.
# Do not edit: rerun the script after an upstream sync.

[package]
name = "studio-gridcraft"
description = "Craft Studio module: gridcraft (upstream gridcraft/apps/gridcraft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false
test = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { version = "0.36" }
gridcraft-engine = { path = "../../../upstream/gridcraft/crates/engine" }
gridcraft-ui-egui = { path = "../../../upstream/gridcraft/crates/ui-egui" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
log = { version = "0.4" }
serde_json = { version = "1", features = ["float_roundtrip"] }
studio-core = { path = "../../studio-core" }

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false }
rfd = { version = "0.17" }

[target.'cfg(target_os = "macos")'.dependencies]
fmv-macos-events = { version = "=0.1.0" }
muda = { version = "0.21", default-features = false }

[build-dependencies]
studio-overlay = { path = "../../studio-overlay" }
