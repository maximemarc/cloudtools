# Generated by scripts/gen-module-manifests.py from upstream/lightcraft/apps/lightcraft/Cargo.toml.
# Do not edit: rerun the script after an upstream sync.

[package]
name = "studio-lightcraft"
description = "Craft Studio module: lightcraft (upstream lightcraft/apps/lightcraft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false
test = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11"] }
egui = { version = "0.36" }
lightcraft-codecs = { path = "../../../upstream/lightcraft/crates/codecs" }
lightcraft-engine = { path = "../../../upstream/lightcraft/crates/engine", features = ["sam"] }
lightcraft-raster = { path = "../../../upstream/lightcraft/crates/raster" }
lightcraft-sysmem = { path = "../../../upstream/lightcraft/crates/sysmem" }
lightcraft-ui-egui = { path = "../../../upstream/lightcraft/crates/ui-egui" }
log = { version = "0.4" }
serde_json = { version = "1", features = ["float_roundtrip"] }
studio-core = { path = "../../studio-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { version = "0.17" }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }

[build-dependencies]
studio-overlay = { path = "../../studio-overlay" }

[features]
default = ["denoise"]
denoise = ["lightcraft-engine/denoise"]
rawnind-model = ["denoise", "lightcraft-engine/rawnind-model"]
heif = ["lightcraft-codecs/heif"]
