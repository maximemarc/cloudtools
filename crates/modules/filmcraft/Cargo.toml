filmcraft-project = { path = "../../../upstream/filmcraft/crates/project" }
filmcraft-render = { path = "../../../upstream/filmcraft/crates/render" }
filmcraft-time = { path = "../../../upstream/filmcraft/crates/time" }
filmcraft-ui-egui = { path = "../../../upstream/filmcraft/crates/ui-egui" }
log = { version = "0.4" }
open = { version = "5" }
rfd = { version = "0.17" }
serde_json = { version = "1" }
studio-core = { path = "../../studio-core" }
sys-locale = { version = "0.3" }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5.19" }

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21" }
objc2 = { version = "0.6" }
