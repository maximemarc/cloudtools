# Generated by scripts/gen-module-manifests.py from upstream/vectorcraft/apps/vectorcraft/Cargo.toml.
# Do not edit: rerun the script after an upstream sync.

[package]
name = "studio-vectorcraft"
description = "Craft Studio module: vectorcraft (upstream vectorcraft/apps/vectorcraft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false
test = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wayland", "x11"] }
egui = { version = "0.36" }
log = { version = "0.4" }
serde_json = { version = "1", features = ["float_roundtrip"] }
studio-core = { path = "../../studio-core" }
vectorcraft-engine = { path = "../../../upstream/vectorcraft/crates/engine" }
vectorcraft-text = { path = "../../../upstream/vectorcraft/crates/text" }
vectorcraft-ui-egui = { path = "../../../upstream/vectorcraft/crates/ui-egui" }

[target.'cfg(all(windows, not(target_vendor = "win7")))'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectWrite"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", default-features = false, features = ["image-data", "wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
rfd = { version = "0.17" }
webbrowser = { version = "1" }
winit = { version = "0.30", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6" }
muda = { version = "=0.21.1", default-features = false }
objc2 = { version = "0.6" }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSButton", "NSControl", "NSMenu", "NSEvent", "NSPasteboard", "NSResponder", "NSTextInputContext", "NSView", "NSWindow"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFString", "CFURL"] }
objc2-core-text = { version = "0.3", default-features = false, features = ["std", "CTFontManager"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSArray", "NSData", "NSGeometry", "NSNotification", "NSOperation", "NSString", "NSURL"] }
pollster = { version = "1" }
raw-window-handle = { version = "0.6" }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4" }
winsafe = { version = "0.0.29", default-features = false, features = ["user"], optional = true }

[build-dependencies]
studio-overlay = { path = "../../studio-overlay" }

[features]
default = ["wgpu", "accessibility"]
wgpu = ["eframe/wgpu", "dep:winsafe"]
accessibility = ["eframe/accesskit"]
windows7 = ["eframe/glow"]
