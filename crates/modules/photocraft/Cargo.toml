[package]
name = "studio-photocraft"
description = "Craft Studio module: photocraft (upstream photocraft/apps/photocraft)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
doctest = false
test = false

[dependencies]
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
egui = { version = "0.36" }
log = { version = "0.4" }
photocraft-automation = { path = "../../../upstream/photocraft/crates/automation" }
photocraft-codecs = { path = "../../../upstream/photocraft/crates/codecs" }
photocraft-color = { path = "../../../upstream/photocraft/crates/color" }
photocraft-compose = { path = "../../../upstream/photocraft/crates/compose" }
photocraft-doc = { path = "../../../upstream/photocraft/crates/doc" }
photocraft-engine = { path = "../../../upstream/photocraft/crates/engine" }
photocraft-format = { path = "../../../upstream/photocraft/crates/format" }
photocraft-geom = { path = "../../../upstream/photocraft/crates/geom" }
photocraft-io = { path = "../../../upstream/photocraft/crates/io" }
photocraft-raster = { path = "../../../upstream/photocraft/crates/raster" }
photocraft-tablet = { path = "../../../upstream/photocraft/crates/tablet" }
photocraft-ui-egui = { path = "../../../upstream/photocraft/crates/ui-egui" }
serde_json = { version = "1" }
studio-core = { path = "../../studio-core" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
arboard = { version = "3.6", features = ["wayland-data-control"] }
open = { version = "5" }
rfd = { version = "0.17" }
ron = { version = "0.12" }

[target.'cfg(target_os = "linux")'.dependencies]
async-io = { version = "=2.6.0" }
futures-lite = { version = "=2.6.1" }
winit = { version = "=0.30.13", default-features = false, features = ["x11"] }
x11rb = { version = "=0.13.2", default-features = false, features = ["image", "randr", "xkb"] }
zbus = { version = "=5.19.0" }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics2 = { version = "=0.6.1", default-features = false, features = ["display", "window", "link", "event"] }
dispatch2 = { version = "=0.3.1", default-features = false, features = ["std"] }
fmv-macos-events = { version = "=0.1.0" }
muda = { version = "=0.21.1", default-features = false }
objc2 = { version = "=0.6.4" }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSApplication", "NSApplicationScripting", "NSEvent", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSArray", "NSEnumerator", "NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
winsafe = { version = "=0.0.29", default-features = false, features = ["user"] }
xcap = { version = "=0.9.8" }

[build-dependencies]
studio-overlay = { path = "../../studio-overlay" }

[features]
heif = ["photocraft-codecs/heif"]
