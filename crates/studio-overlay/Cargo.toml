[package]
name = "studio-overlay"
description = "Build-time adapter: compiles an upstream Craft app's binary sources as a module of a library crate"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
syn = { version = "2.0.119", features = ["full", "visit", "parsing"] }
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
