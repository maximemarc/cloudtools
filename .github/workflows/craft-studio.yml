# Craft Studio on the three desktop platforms.
#
# Every OS: release build, then `--smoke` (every app opened in turn, one screenshot each; it fails
# if an app fails to start or panics). Linux runs it under Xvfb on Mesa's software renderers, macOS
# on the runner's paravirtual Metal device. Windows runners have no GPU, so the Windows run is
# best-effort: a failure is a warning and the screenshots show how far it got.
name: Craft Studio

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    # Branches of this repository already build on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04, smoke_required: true }
          - { name: macOS, os: macos-15, smoke_required: true }
          - { name: Windows, os: windows-2025, smoke_required: false }
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Sources are compiled byte for byte (build-time rewrite, embedded assets): no CRLF conversion.
      - name: Configure git
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      # The submodules (restrictive or missing licences) are not part of the build.
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            xvfb mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build
        run: cargo build --release --locked -p craft-studio

      - name: Command line
        run: |
          target/release/craft-studio --version
          target/release/craft-studio --list

      - name: Smoke test
        continue-on-error: ${{ !matrix.smoke_required }}
        timeout-minutes: 20
        env:
          RUST_LOG: info,wgpu_core=warn,wgpu_hal=warn,naga=warn
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" target/release/craft-studio --smoke smoke
          else
            target/release/craft-studio --smoke smoke
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14
