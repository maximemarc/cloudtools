# Craft Studio on the three desktop platforms.
#
# Every OS: release build, then `--smoke` (every app opened in turn, one screenshot each; the job
# fails if an app fails to start or panics). The runners have no GPU: Linux renders under Xvfb with
# Mesa's software drivers, macOS on the paravirtual Metal device, Windows on WARP (DirectX 12 on the
# CPU, where EffectCraft's GPU compositor falls back to the CPU, as upstream expects).
#
# A v* tag also packages each build (apps/craft-studio/packaging/package.sh) and publishes the
# packages on a GitHub release. "Run workflow" packages without releasing (the packages-<OS>
# artifacts), to try the installers before tagging.
name: Craft Studio

on:
  push:
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
    paths-ignore: ["docs/**", "**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  # Compiled crates are cached by sccache (rustc, and the C compilers cc-rs runs) in the Actions
  # cache. It keys on content, so it also reuses the upstream crates: Cargo rebuilds path crates
  # after every fresh checkout (new mtimes), which makes a cached target directory useless for them.
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: sccache

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.name }}
    # Branches of this repository already build on push.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      PACKAGE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu: the binary and the .deb need its glibc (2.35) or newer.
          - { name: Linux, os: ubuntu-22.04 }
          - { name: macOS, os: macos-15 }
          - { name: Windows, os: windows-2025 }
    steps:
      - name: Free disk space
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      # Sources are compiled byte for byte (build-time rewrite, embedded assets): no CRLF conversion.
      - name: Configure git
        if: runner.os == 'Windows'
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      # The submodules (restrictive or missing licences) are not part of the build.
      - uses: actions/checkout@v5
        with:
          submodules: false
          persist-credentials: false

      - name: Install system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libasound2-dev \
            xvfb mesa-vulkan-drivers libegl1 libgl1-mesa-dri \
            libxkbcommon-x11-0 libxcursor1 libxi6 libxrandr2

      - uses: dtolnay/rust-toolchain@stable

      - uses: mozilla-actions/sccache-action@v0.0.11

      # The registry and git checkouts only; sccache has the compiled crates.
      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-targets: false

      - name: Build
        run: cargo build --release --locked -p craft-studio

      - name: Compiler cache
        if: always()
        run: sccache --show-stats

      - name: Command line
        run: |
          target/release/craft-studio --version
          target/release/craft-studio --list

      # About 1 min on Linux and macOS, 9 min on WARP.
      - name: Smoke test
        timeout-minutes: 20
        env:
          RUST_LOG: info,wgpu_core=warn,wgpu_hal=warn,naga=warn
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run -a -s "-screen 0 1920x1080x24" target/release/craft-studio --smoke smoke
          else
            target/release/craft-studio --smoke smoke
          fi

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: smoke-${{ runner.os }}
          path: smoke/
          if-no-files-found: warn
          retention-days: 14

      - name: Install cargo-deb
        if: env.PACKAGE == 'true' && runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb

      - name: Install Inno Setup
        if: env.PACKAGE == 'true' && runner.os == 'Windows'
        run: |
          if ! command -v iscc > /dev/null && [ ! -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]; then
            choco install innosetup --no-progress -y
          fi

      - name: Package
        if: env.PACKAGE == 'true'
        run: apps/craft-studio/packaging/package.sh dist

      - name: Upload packages
        if: env.PACKAGE == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: packages-${{ runner.os }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('Cargo.toml', 'rb'))['workspace']['package']['version'])")
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the workspace version $version (Cargo.toml)"
            exit 1
          fi
          (cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            prerelease=()
            [[ "$version" == *-* ]] && prerelease=(--prerelease)
            gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --verify-tag "${prerelease[@]}" \
              --title "Craft Studio $version" --notes-file apps/craft-studio/packaging/release-notes.md
          fi
