[package]
name = "lightcraft-fetch"
version.workspace = true
edition.workspace = true
license = "Apache-2.0"
description = "LightCraft model downloads: mirrors, resume, pinned SHA-256, over HTTPS in pure Rust (L0)"

[lints]
workspace = true

# downloads run natively only (the web build fetches no models)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
log = { workspace = true }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
# Prebuilt NASM objects: Windows builds need no assembler (same setup as pdfcraft-sign).
aws-lc-rs = { version = "1.18", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
webpki-roots = "1"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
