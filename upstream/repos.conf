# Upstream ArtCraft repositories imported into this monorepo.
#
# name                   mode       branch  exclude                                       license
#
# mode:
#   vendor     tracked snapshot copied under upstream/<name> (permissive licence only)
#   submodule  git submodule pointing to github.com/storytold/<name>; no code is
#              redistributed (restrictive or missing licence, this repo is public)
# exclude:     comma-separated paths (git pathspecs, relative to the repo) not vendored, or "-".
#              artcraft: the Tauri + React app (telemetry, 82 npm advisories) is replaced in
#              Craft Studio by artcraft-native; patches/artcraft drops it from the workspace.
#
# After vendoring, scripts/upstream-sync.sh applies patches/<name>/*.patch, then
# scripts/fix-lockfile-vulns.py. Pinned commits live in upstream/UPSTREAM.lock.

artcraft                 vendor     main    frontend,crates/desktop/artcraft,crates/vendor/tauri-plugin-http,crates/schema/database/sqlite_tasks  MIT OR Apache-2.0
craft-libs               vendor     main    -                                             MIT OR Apache-2.0
craft-launcher           vendor     main    -                                             MIT OR Apache-2.0
craft-fonts              vendor     main    -                                             MIT OR Apache-2.0 (+ per-font OFL)
craft-repo-status-app    vendor     main    -                                             MIT (Cargo.toml only, no LICENSE file)
photocraft               vendor     main    -                                             MIT OR Apache-2.0
photocraft-corpus        vendor     main    -                                             MIT OR Apache-2.0
lightcraft               vendor     main    -                                             MIT OR Apache-2.0
filmcraft                vendor     main    -                                             MIT OR Apache-2.0
pdfcraft                 vendor     main    -                                             MIT OR Apache-2.0
vectorcraft              vendor     main    -                                             MIT OR Apache-2.0
effectcraft              vendor     main    -                                             MIT OR Apache-2.0
wordcraft                vendor     main    -                                             MIT OR Apache-2.0
designcraft              vendor     main    -                                             MIT OR Apache-2.0
gridcraft                vendor     main    -                                             MIT OR Apache-2.0
cadcraft                 vendor     main    -                                             MIT OR Apache-2.0
deckcraft                vendor     main    -                                             MIT OR Apache-2.0
soundcraft               vendor     main    -                                             MIT OR Apache-2.0
artcraft-services        submodule  main    -                                             ArtCraft License (WIP), personal use only
artcraftx                submodule  main    -                                             none
cloud-worker             submodule  main    -                                             none
